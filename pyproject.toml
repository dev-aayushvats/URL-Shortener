[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real PostgreSQL via TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["app"]
